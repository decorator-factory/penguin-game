[package]
name = "penguin-game"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"

[dependencies]
glam = { version = "0.27", default-features = false, features = [
    "debug-glam-assert",
] }
nalgebra = { version = "0.34", default-features = false }
arrayvec = "0.7"
macroquad = "0.4"
miniquad = "0.4" # should be pinned by macroquad
parry2d = { version = "0.25", default-features = false, features = [
    "required-features",
    "alloc",
] }
image = { version = "0.24", default-features = false, features = ["png"] }
thiserror = "2"
enumset = "=1.1.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_else = "allow"

# Restrictions
as_underscore = "deny"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
disallowed_script_idents = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
infinite_loop = "warn"
large_include_file = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "warn"  # turn it off if it gets too noisy
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "warn"
needless_raw_strings = "deny"
non_ascii_literal = "deny"
non_zero_suggestions = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "warn"
renamed_function_params = "deny"
#^ since we're using Vec2 and f32 a lot, a parameter name change in
#^ the trait may indicate change in purpose while the type is the same
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
separated_literal_suffix = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "warn"
try_err = "deny"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unwrap_in_result = "warn"
