<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Penguin Game</title>
        <style>
            html,
            body,
            #penguin-game-canvas {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                position: absolute;
                background: black;
                z-index: 0;
            }

            #penguin-game-canvas {
                /* Prevent the user from being able to drag the canvas, which can happen with Ctrl+A */
                user-select: none;
            }

            #error {
                background: white;
                color: black;
                display: none;
                padding: 0.25em;
            }

            .limit-width {
                max-width: 40em;
            }

            .preserve-formatting {
                font-family: monospace;
                white-space: pre-wrap;
                max-width: 60em;
            }

            #error.show {
                display: block;
            }
        </style>
    </head>

    <body>
        <div id="error" aria-hidden="true">
            <p class="limit-width">
                The game experienced a "panic", which likely means that there's a bug in the game.
                Please report the following error message in an issue at
                <a href="https://github.com/decorator-factory/penguin-game/issues">
                    https://github.com/decorator-factory/penguin-game/issues</a>
            </p>

            <p id="backtrace" class="preserve-formatting"></p>
        </div>
        <canvas id="penguin-game-canvas" tabindex="1"></canvas>
        <script>
            const errorElement = document.getElementById("error");
            const backtraceElement = document.getElementById("backtrace");

            import("./miniquad.js").then((miniquad) => {
                console.log("minquad.js loaded!");
                miniquad.set_canvas(document.getElementById("penguin-game-canvas"));
                miniquad.define_ffi_function("is_wasm_demo", function () {
                    return document.location.hash == "#demo";
                });
                miniquad.add_panic_handler((message, backtrace) => {
                    backtraceElement.innerText = message + "\n--------\n" + backtrace;
                    errorElement.classList.add("show");
                })
                miniquad.load("penguin-game.wasm");
            });
        </script>
    </body>
</html>
