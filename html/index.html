<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penguin Game</title>
  <style>
    html,
    body,
    #rjp-canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: absolute;
      background: black;
      z-index: 0;
    }

    #rjp-canvas {
      /* Prevent the user from being able to drag the canvas, which can happen with Ctrl+A */
      user-select: none;
    }

    #error {
      background: white;
      color: black;
      display: none;
      padding: 0.25em;
    }

    .limit-width {
      max-width: 40em;
    }

    .preserve-formatting {
      font-family: monospace;
      white-space: pre-wrap;
    }

    #error.show {
      display: block;
    }
  </style>
  <link rel="modulepreload" href="rjp.js"/>
  <link rel="modulepreload" href="miniquad.js"/>
  <link rel="preload" href="rjp.wasm" as="fetch" crossorigin/>
</head>

<body>
  <div id="error" aria-hidden="true">
    <p class="limit-width">
      The game experienced a "panic", which likely means that there's a bug in the game.
      Please report the following error message in an issue at
      <a href="https://github.com/decorator-factory/rjp/issues">
        https://github.com/decorator-factory/rjp/issues</a>
    </p>

    <p id="backtrace" class="preserve-formatting"></p>
  </div>
  <canvas id="rjp-canvas" tabindex="1"></canvas>
  <script type="module">
    import * as penguinGame from "./rjp.js";

    const errorElement = document.getElementById("error");
    const backtraceElement = document.getElementById("backtrace");
    const canvasElement = document.getElementById("rjp-canvas");
    penguinGame.init({
      errorElement,
      backtraceElement,
      canvasElement,
    })
  </script>
</body>

</html>
